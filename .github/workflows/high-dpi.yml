name: High DPI contracts
on: [push, pull_request]
jobs:
  dpi:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 5.15.2's MSVC headers require the STL shipped with v142.
          - os: windows-2022
            qt: '5.15.2'
            arch: win64_msvc2019_64
            major: 5
            cmake_args: -T v142
            archives: qtbase qtsvg
          - os: windows-latest
            qt: '6.8.3'
            arch: win64_msvc2022_64
            major: 6
            archives: qtbase qtsvg
          - os: ubuntu-22.04
            qt: '5.15.2'
            arch: gcc_64
            major: 5
            archives: qtbase qtsvg icu
          - os: macos-14
            qt: '6.8.3'
            arch: clang_64
            major: 6
            archives: qtbase qtsvg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          archives: ${{ matrix.archives }}
          cache: true
      - name: Configure production-code tests
        run: >-
          cmake -S tests/dpi -B build-dpi
          -DDPI_QT_MAJOR=${{ matrix.major }} ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build-dpi --config Release --parallel
      - name: Test fractional scales in separate processes
        run: ctest --test-dir build-dpi -C Release --output-on-failure --parallel 2
